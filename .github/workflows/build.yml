name: iMX8 - build

on:
  workflow_call:
    inputs:
      bsp:
        description: "BSP/release to build (scarthgap, kirkstone)"
        type: string
        required: true
      machine:
        description: "Board variant (astrial-2gb-imx8mp, astrial-4gb-imx8mp, astrial-8gb-imx8mp)"
        type: string
        required: true
      ref:
        description: "Ref (branch/tag/sha) of meta-sysele-astrial-imx8 to build"
        type: string
        required: true
      sbom:
        description: "SBOM/CVE level (none, standard, full)"
        type: string
        default: none
    outputs:
      kernel_version:
        description: "Kernel package version actually installed in the image"
        value: ${{ jobs.build.outputs.kernel_version }}
      hailort_version:
        description: "HailoRT version actually installed in the image"
        value: ${{ jobs.build.outputs.hailort_version }}
      tappas_version:
        description: "TAPPAS-Core version actually installed in the image"
        value: ${{ jobs.build.outputs.tappas_version }}
      nxp_bsp_tag:
        description: "meta-imx release tag the build was made against"
        value: ${{ jobs.build.outputs.nxp_bsp_tag }}

concurrency:
  group: imx8-${{ inputs.bsp }}-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 720
    outputs:
      kernel_version: ${{ steps.artifacts.outputs.kernel_version }}
      hailort_version: ${{ steps.artifacts.outputs.hailort_version }}
      tappas_version: ${{ steps.artifacts.outputs.tappas_version }}
      nxp_bsp_tag: ${{ steps.artifacts.outputs.nxp_bsp_tag }}
    env:
      BSP: /home/github/imx8-trial-${{ inputs.bsp }}
      LAYER: /home/github/imx8-trial-${{ inputs.bsp }}/sources-extra/meta-sysele-astrial-imx8
      MACHINE: ${{ inputs.machine }}
      DISTRO: fsl-imx-xwayland
    steps:
      - name: Sync meta-sysele-astrial-imx8 to the requested ref
        run: |
          cd "$LAYER"
          git fetch system "${{ inputs.ref }}"
          git clean -fdx
          git checkout --detach FETCH_HEAD
          echo "Checked out: $(git rev-parse HEAD) ($(git log -1 --oneline))"

      - name: Set MACHINE and SBOM/CVE level
        run: |
          B="$BSP/build"
          sed -i '/^MACHINE /d; /^SYSELE_SBOM /d' "$B/conf/local.conf"
          echo "MACHINE = \"$MACHINE\"" >> "$B/conf/local.conf"
          echo 'SYSELE_SBOM = "${{ inputs.sbom }}"' >> "$B/conf/local.conf"

      - name: Build system-astrial-image
        run: |
          cd "$BSP"
          ulimit -n 65536
          source astrial-setup-env build
          bitbake system-astrial-image -k

      - name: Collect logs on failure
        if: failure()
        run: |
          B="$BSP/build"
          echo "--- bitbake-cookerdaemon.log tail ---"
          tail -c 20000 "$B/bitbake-cookerdaemon.log" 2>/dev/null || true
          echo "--- most recent pseudo.log files ---"
          find "$B/tmp/work" -name pseudo.log -newer "$B/conf/local.conf" 2>/dev/null \
            | tail -5 | xargs -r -I{} sh -c 'echo ===={}====; tail -c 4000 "{}"'
          echo "--- disk/memory ---"
          df -h "$B" 2>/dev/null
          free -h

      - name: Locate and validate artifacts
        id: artifacts
        run: |
          OUT="$BSP/build/tmp/deploy/images/$MACHINE"
          # kirkstone and scarthgap name the stable symlink differently
          # (with or without a ".rootfs" infix), so glob instead of a fixed name.
          find_one() { ls -t "$OUT"/system-astrial-image-"$MACHINE"*"$1" 2>/dev/null | head -1; }
          WIC=$(find_one .wic.zst)
          BMAP=$(find_one .wic.bmap)
          SPDX=$(find_one .spdx.tar.zst)
          if [ -z "$WIC" ]; then
            echo "ERROR: no system-astrial-image-$MACHINE*.wic.zst found in $OUT"
            exit 1
          fi
          # eMMC flashing via NXP uuu needs this bootloader binary, built
          # alongside the image but under its own fixed name (no ".rootfs" variance).
          IMXBOOT="$OUT/imx-boot-$MACHINE-sd.bin-flash_evk"
          if [ ! -f "$IMXBOOT" ]; then
            echo "ERROR: $IMXBOOT not found"
            exit 1
          fi
          echo "wic=$WIC" >> "$GITHUB_OUTPUT"
          echo "bmap=$BMAP" >> "$GITHUB_OUTPUT"
          echo "spdx=$SPDX" >> "$GITHUB_OUTPUT"
          echo "imxboot=$IMXBOOT" >> "$GITHUB_OUTPUT"

          # Measured, not hand-typed: read the versions actually installed
          # in this build from its own manifest and layer checkout.
          MANIFEST=$(find_one .manifest)
          KERNEL_VER=$(awk '$1 ~ /^kernel-[0-9]/ { sub(/^kernel-/, "", $1); print $1; exit }' "$MANIFEST")
          HAILORT_VER=$(awk '$1 == "hailortcli" { sub(/-r[0-9]+$/, "", $3); print $3; exit }' "$MANIFEST")
          TAPPAS_VER=$(awk '$1 == "tappas-apps" { sub(/-r[0-9]+$/, "", $3); print $3; exit }' "$MANIFEST")
          NXP_BSP_TAG=$(git -C "$BSP/sources/meta-imx" describe --tags 2>/dev/null || echo unknown)
          echo "kernel_version=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "hailort_version=$HAILORT_VER" >> "$GITHUB_OUTPUT"
          echo "tappas_version=$TAPPAS_VER" >> "$GITHUB_OUTPUT"
          echo "nxp_bsp_tag=$NXP_BSP_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: imx8-${{ inputs.bsp }}-${{ env.MACHINE }}-image
          path: |
            ${{ steps.artifacts.outputs.wic }}
            ${{ steps.artifacts.outputs.bmap }}
            ${{ steps.artifacts.outputs.imxboot }}
          retention-days: 14

      - name: Upload SBOM/CVE
        if: inputs.sbom != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: imx8-${{ inputs.bsp }}-${{ env.MACHINE }}-sbom
          path: ${{ steps.artifacts.outputs.spdx }}
          retention-days: 14
