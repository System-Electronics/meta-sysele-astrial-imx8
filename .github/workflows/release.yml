name: iMX8 - release

run-name: iMX8 Release • ${{ github.ref_name }}

# A release is born only from a tag pushed by hand, with an annotated message:
# that message becomes the changelog in the GitHub Release.
#
#   git tag -a v1.1.6 -m "- Bullet list of what changed in this release"
#   git push origin v1.1.6
#
# Scheme: major = BSP (kirkstone 1, scarthgap 2), minor = backward-incompatible
# change, patch = everything else. A candidate is named v1.1.6-rc1 and comes
# out marked prerelease.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bsp: ${{ steps.bsp.outputs.bsp }}
      changelog: ${{ steps.changelog.outputs.text }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Determine the BSP from the tag's major version
        id: bsp
        run: |
          MAJOR=$(echo "${{ github.ref_name }}" | sed -E 's/^v([0-9]+)\..*/\1/')
          case "$MAJOR" in
            1) echo "bsp=kirkstone" >> "$GITHUB_OUTPUT" ;;
            2) echo "bsp=scarthgap" >> "$GITHUB_OUTPUT" ;;
            *) echo "ERROR: no BSP mapped for major version $MAJOR" >&2; exit 1 ;;
          esac

      - name: Read the changelog from the annotated tag
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          REF_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq .object.sha)
          REF_TYPE=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq .object.type)
          if [ "$REF_TYPE" != "tag" ]; then
            echo "ERROR: $TAG is a lightweight tag with no message." >&2
            echo "       Delete it and push an annotated tag instead: git tag -a $TAG -m '...'" >&2
            exit 1
          fi
          MSG=$(gh api "repos/${{ github.repository }}/git/tags/$REF_SHA" --jq .message)
          {
            echo "text<<CHANGELOG_EOF"
            echo "$MSG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      # All three machines share one persistent build tree per BSP, so they
      # cannot run concurrently: the build.yml concurrency group queues across
      # separate runs, but does not reliably queue matrix legs within the same
      # run (one was cancelled outright instead of queued). Force them one at
      # a time here instead of relying on that.
      max-parallel: 1
      matrix:
        machine: [astrial-2gb-imx8mp, astrial-4gb-imx8mp, astrial-8gb-imx8mp]
    uses: ./.github/workflows/build.yml
    with:
      bsp: ${{ needs.resolve.outputs.bsp }}
      machine: ${{ matrix.machine }}
      ref: ${{ github.ref_name }}
      sbom: standard

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: imx8-${{ needs.resolve.outputs.bsp }}-*-image
          path: release-files
          merge-multiple: true

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: imx8-${{ needs.resolve.outputs.bsp }}-*-sbom
          path: release-files
          merge-multiple: true
        continue-on-error: true

      - name: Download CVE report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: imx8-${{ needs.resolve.outputs.bsp }}-*-cve
          path: release-files
          merge-multiple: true
        continue-on-error: true

      - name: Package per machine, with external checksums
        # One package for the image+bootloader, one for SBOM+CVE, per machine: whoever
        # wants only the CVE report for an audit doesn't pull three sets of binaries to
        # get it, and whoever flashes a board doesn't pull SPDX files for it. The
        # checksum covers the whole package, not each member, and lives next to it as
        # its own file: putting it inside the archive it describes would change that
        # archive after the checksum was already taken.
        id: contents
        run: |
          set -euo pipefail
          mkdir -p packages
          TAG="${{ github.ref_name }}"
          BSP="${{ needs.resolve.outputs.bsp }}"
          : > /tmp/contents.md

          for MACHINE in astrial-2gb-imx8mp astrial-4gb-imx8mp astrial-8gb-imx8mp; do
            IMAGE_PKG="astrial-imx8-${BSP}-${TAG}-${MACHINE}-image.tar.gz"
            SBOM_PKG="astrial-imx8-${BSP}-${TAG}-${MACHINE}-sbom-cve.tar.gz"

            cd release-files
            shopt -s nullglob
            IMAGE_FILES=(
              system-astrial-image-"$MACHINE"*.wic.zst
              system-astrial-image-"$MACHINE"*.wic.bmap
              "imx-boot-$MACHINE-sd.bin-flash_evk"
            )
            SBOM_FILES=(
              system-astrial-image-"$MACHINE"*-build.spdx.json
              system-astrial-image-"$MACHINE"*-deployed.spdx.json
              "system-astrial-image-$MACHINE-cve-summary.json"
              "system-astrial-image-$MACHINE-cve-summary.txt"
            )
            PRESENT_IMAGE=(); for f in "${IMAGE_FILES[@]}"; do [ -e "$f" ] && PRESENT_IMAGE+=("$f"); done
            PRESENT_SBOM=(); for f in "${SBOM_FILES[@]}"; do [ -e "$f" ] && PRESENT_SBOM+=("$f"); done

            if [ "${#PRESENT_IMAGE[@]}" -eq 0 ]; then
              echo "::error::No image files found for $MACHINE" >&2
              exit 1
            fi
            # Insert the tag right before each file's own extension (its first
            # dot), so extracting several releases into the same folder no
            # longer collides their members into one filename.
            TRANSFORM="s/^\([^.]*\)\./\1-${TAG}./"
            tar --transform="$TRANSFORM" -czf "../packages/$IMAGE_PKG" "${PRESENT_IMAGE[@]}"
            echo "- \`$IMAGE_PKG\` (+ \`.md5\`): $MACHINE SD card image (write with \`bmaptool copy\`) and eMMC bootloader for \`uuu\`" >> /tmp/contents.md

            if [ "${#PRESENT_SBOM[@]}" -gt 0 ]; then
              tar --transform="$TRANSFORM" -czf "../packages/$SBOM_PKG" "${PRESENT_SBOM[@]}"
              echo "- \`$SBOM_PKG\` (+ \`.md5\`): $MACHINE SBOM (build + deployed, SPDX 2.2) and CVE report" >> /tmp/contents.md
            fi
            cd ..
          done

          cd packages
          for f in *.tar.gz; do
            md5sum "$f" > "$f.md5"
          done
          ls -lh
          cd ..

          {
            echo "list<<CONTENTS_EOF"
            cat /tmp/contents.md
            echo "CONTENTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release for the pushed tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Astrial iMX8 ${{ needs.resolve.outputs.bsp }} ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body: |
            ${{ needs.resolve.outputs.changelog }}

            **Stack:**
            - NXP BSP: `${{ needs.build.outputs.nxp_bsp_tag }}`
            - Kernel: `${{ needs.build.outputs.kernel_version }}`
            - HailoRT: `${{ needs.build.outputs.hailort_version }}`
            - TAPPAS-Core: `${{ needs.build.outputs.tappas_version }}`

            **Build Information:**
            - Commit: ${{ github.sha }}
            - Build Date: ${{ github.event.head_commit.timestamp }}

            **Package Contents:**
            ${{ steps.contents.outputs.list }}

            Verify each package with: `md5sum -c <filename>.md5`

            NXP documentation and the Yocto SDK are distributed separately, not through this release.
            Full flashing procedure: https://github.com/System-Electronics/astrial-howto
          files: packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
