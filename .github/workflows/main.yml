name: iMX8 scarthgap - continuous build

on:
  push:
    branches:
      - wip/content-v2
  schedule:
    # Biweekly scheduled build, independent of pushes.
    - cron: '0 3 */14 * *'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # Scheduled runs aren't tied to a push, so resolve the ref explicitly.
      ref: ${{ github.event_name == 'schedule' && 'wip/content-v2' || github.ref_name }}
      sbom: none
