name: iMX8 - continuous build

run-name: iMX8 Build • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  push:
    branches:
      - kirkstone
      - scarthgap
  schedule:
    # Canary builds, staggered so scarthgap and kirkstone never land on the
    # same night on the shared self-hosted runner.
    - cron: '0 2 2,16 * *'   # scarthgap
    - cron: '0 2 5,19 * *'   # kirkstone

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      bsp: ${{ steps.resolve.outputs.bsp }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve bsp and ref for this trigger
        id: resolve
        # The branch names match the bsp names, so a push's own ref_name is
        # both already; only a schedule has no ref_name and needs the cron to say which.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 2 2,16 * *" ]; then
              BSP=scarthgap
            else
              BSP=kirkstone
            fi
          else
            BSP="${{ github.ref_name }}"
          fi
          echo "bsp=$BSP" >> "$GITHUB_OUTPUT"
          echo "ref=$BSP" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      bsp: ${{ needs.resolve.outputs.bsp }}
      machine: astrial-8gb-imx8mp
      ref: ${{ needs.resolve.outputs.ref }}
      # The canary is the only one of the two triggers that runs unattended and
      # without review, so it's the one that must catch a CVE regression on its
      # own. Kirkstone's cve-check is still not wired up (see build.yml), so this
      # only has a practical effect on scarthgap for now.
      sbom: ${{ github.event_name == 'schedule' && 'standard' || 'none' }}
