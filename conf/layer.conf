# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sysele-astrial-imx8"
BBFILE_PATTERN_sysele-astrial-imx8 = "^${LAYERDIR}/"
BBFILE_PRIORITY_sysele-astrial-imx8 = "9"

LAYERDEPENDS_sysele-astrial-imx8 = "core"
LAYERSERIES_COMPAT_sysele-astrial-imx8 = "kirkstone"

#################################################################################################################
## Intel Realsense
PACKAGECONFIG:append:pn-librealsense2 = " rsusb"

