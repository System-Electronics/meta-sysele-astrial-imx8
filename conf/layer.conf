# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sysele-astrial-imx8"
BBFILE_PATTERN_sysele-astrial-imx8 = "^${LAYERDIR}/"
BBFILE_PRIORITY_sysele-astrial-imx8 = "9"

LAYERDEPENDS_sysele-astrial-imx8 = "core"
LAYERSERIES_COMPAT_sysele-astrial-imx8 = "scarthgap"

# Text for custom, non-SPDX license identifiers that do_create_spdx needs but
# some recipes never register (kirkstone hit this with Qt6 and a few meta-oe
# benchmark recipes; add files here under the exact identifier name as needed).
LICENSE_PATH += "${LAYERDIR}/licenses"

#################################################################################################################
## Intel Realsense
PACKAGECONFIG:append:pn-librealsense2 = " rsusb"

## Enable SE05: comment it to use plug-and-trust-ecc and openssl-provider-se05 of meta-imx 
#ENABLE_SE05 = "1"
